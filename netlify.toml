# Static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

# Let phones pick up new versions of the offline cache straight away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
